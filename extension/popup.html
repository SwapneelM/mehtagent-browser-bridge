<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Local Browser Bridge</title><link rel="stylesheet" href="popup.css"></head>
<body class="popup"><p class="eyebrow">THIS BROWSER PROFILE</p><h1>Local Browser Bridge</h1><p id="status" role="status">Checking connection…</p>
<button id="toggle" disabled>Connect</button><button id="settings" class="secondary">Site permissions</button>
<section id="approval" hidden aria-label="Pending command">
<h2>Approval needed</h2><p id="approval-summary"></p><pre id="approval-details" tabindex="0" aria-label="Full command details"></pre>
<div class="actions"><button id="approve">Approve once</button><button id="deny" class="secondary">Deny</button></div></section>
<dl><dt>Connection</dt><dd id="session">—</dd><dt>Last action</dt><dd id="action">—</dd></dl>
<p id="error" role="alert"></p><p class="footnote">Only sites you grant are accessible. Disconnect stops new commands; an action already sent may finish.</p>
<script src="approval.js"></script><script src="popup.js"></script></body></html>
